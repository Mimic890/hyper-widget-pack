; Theme picker window. Opened/closed from any widget: right-click > Themes...
; Click a theme or Light/Dark/Auto: saved to Variables.inc, all widgets refresh.
; Auto picks Light/Dark by wallpaper brightness (AutoMode skin) for Graphite, Warm, GitHub, Kanagawa.
; Generated layout: rows at fixed Y (header 18 px, row 28 px).

[Rainmeter]
Update=-1
AccurateText=1
Group=HyperWidgets
ContextTitle=Close
ContextAction=[!DeactivateConfig]

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
W=236
Pad=10
Save=[!RefreshGroup HyperWidgets]

[MeasurePicker]
Measure=Script
ScriptFile=#@#Scripts\Picker.lua
ThemesDir=#@#Themes\
Theme=#Theme#
Appearance=#Appearance#
Mode=#Mode#

; ---------- Styles ----------
[StyleHeader]
X=(#Pad#+4)
FontFace=#FontFace#
FontSize=8
FontWeight=700
FontColor=#Dim#,255
AntiAlias=1

; Clickable row with hover highlight; swatch drawn as Shape2..Shape6 in each row.
[StyleRow]
X=#Pad#
Shape=Rectangle 0,0,(#W#-2*#Pad#),28,6 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,(#W#-2*#Pad#),28,6 | Fill Color #Grid#,18 | StrokeWidth 0"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,(#W#-2*#Pad#),28,6 | Fill Color 0,0,0,1 | StrokeWidth 0"][!UpdateMeter #CURRENTSECTION#][!Redraw]
DynamicVariables=1

[StyleRowText]
X=(#Pad#+8)
Y=14r
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=10
AntiAlias=1
DynamicVariables=1

; ---------- Meters ----------
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,#W#,374,10 | Fill Color #Bg#,250 | StrokeWidth 1 | Stroke Color #Grid#,25

[MeterClose]
Meter=String
X=(#W#-#Pad#-4)
Y=6
StringAlign=Right
FontFace=#FontFace#
FontSize=12
FontColor=#Dim#,255
AntiAlias=1
SolidColor=0,0,0,1
Text=[\x00D7]
ToolTipText=Close
LeftMouseUpAction=[!DeactivateConfig]

[MeterHeaderBRAND]
Meter=String
MeterStyle=StyleHeader
Y=10
Text=BRAND

[MeterRowGraphite]
Meter=Shape
MeterStyle=StyleRow
Y=28
Shape2=Rectangle 168,7,11,14 | Fill Color [&MeasurePicker:Color('Graphite', 'Text')] | StrokeWidth 0
Shape3=Rectangle 179,7,11,14 | Fill Color [&MeasurePicker:Color('Graphite', 'AccentCpu')] | StrokeWidth 0
Shape4=Rectangle 190,7,11,14 | Fill Color [&MeasurePicker:Color('Graphite', 'Dim')] | StrokeWidth 0
Shape5=Rectangle 201,7,11,14 | Fill Color [&MeasurePicker:Color('Graphite', 'Bg')] | StrokeWidth 0
Shape6=Rectangle 168,7,44,14,2 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Grid#,40
LeftMouseUpAction=[!WriteKeyValue Variables Theme Graphite "#@#Variables.inc"]#Save#

[MeterTextGraphite]
Meter=String
MeterStyle=StyleRowText
Text=[\[&MeasurePicker:Check('Graphite')]]  Graphite
FontColor=[&MeasurePicker:Fg('Graphite')],255
FontWeight=[&MeasurePicker:Weight('Graphite')]

