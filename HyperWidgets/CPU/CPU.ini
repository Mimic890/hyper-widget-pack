[Metadata]
Name=HyperWidgets CPU
Information=CPU usage and load average 1/5/15 min.

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
; File of the list view (right-click > View).
ListFile=CPU.ini
Accent=#AccentCpu#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale). Raise if text is cut off.
; TitleCut = how much shorter without the title (right-click > Title).
TitleCut=14
WidgetH=99

; ---------- Meters ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=CPU

; Hover (H1 / H2, see Hover.inc): label and value grow, label Dim -> Text, bar gets thicker
; around its middle and its track lighter. Hit meters sit in the row chain right before the label.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(4*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+18)*#Scale#)

[MeterUsageLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=USAGE
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);(((#Pad#*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterUsageLabel:Y]+[MeterUsageLabel:H]/2)*(1-(1+0.15*#H1#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]
DynamicVariables=1

[MeterUsageValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureCPU
Text=%1 %
FontColor=#AccentCpu#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterUsageValue:Y]+[MeterUsageValue:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[MeterUsageBar]
Meter=Bar
Container=MeterFrame
MeasureName=MeasureCPU
X=(#Pad#*#Scale#)
Y=((6-1.5*#H1#)*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=((4+3*#H1#)*#Scale#)
BarOrientation=Horizontal
BarColor=#AccentCpu#,255
SolidColor=[&MeasureHover:Color('Grid', 25, #H1#, 55)]
DynamicVariables=1

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((2-1.5*#H1#)*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+8)*#Scale#)

[MeterLoadLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=LOAD
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);(((#Pad#*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterLoadLabel:Y]+[MeterLoadLabel:H]/2)*(1-(1+0.15*#H2#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]
DynamicVariables=1

[MeterLoadValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
Text=[&MeasureLoad:Avg(1)]  [&MeasureLoad:Avg(2)]  [&MeasureLoad:Avg(3)]
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterLoadValue:Y]+[MeterLoadValue:H]/2)*(1-(1+0.15*#H2#))))
DynamicVariables=1
