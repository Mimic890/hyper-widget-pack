[Metadata]
Name=HyperWidgets GPU (rings)
Information=GPU load, VRAM, temperature as rings (nvidia-smi).

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
@IncludeRings=#@#Rings.inc
; File of the list view (right-click > View).
ListFile=GPU.ini
Accent=#AccentGpu#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale); TitleCut = how much shorter without the title.
TitleCut=26
WidgetH=136

; ---------- Meters (layout in base px, all * Scale) ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=GPU

; Hover (H1..H3, see Hover.inc): ring grows 64 -> 70 px around its center, stroke 7 -> 10,
; track and fill light up, value and caption grow, caption Dim -> Text.
[MeterRingLoad]
Meter=Shape
Container=MeterFrame
X=((12)*#Scale#)
Y=((14+26*#ShowTitle#)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((32)*#Scale#),((32)*#Scale#),(((32)*#Scale#)-(7+2*#H1#)*#Scale#) | Fill Color #AccentGpu#,(28*#H1#) | StrokeWidth 0
Shape=[&MeasureRing:RestOf('MeasureGpuLoad', #Scale#, 64, 7+2*#H1#)] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #Grid#,(22+28*#H1#)
Shape2=[&MeasureRing:ArcOf('MeasureGpuLoad', #Scale#, 64, 7+2*#H1#)] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #AccentGpu#,255 | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H1#);0;0;(1+0.1*#H1#);(((((12)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H1#)))+[MeasureFrameX]*(1-(1+0.1*#H1#)));(((((14+26*#ShowTitle#)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H1#)))+#Margin#*(1-(1+0.1*#H1#)))

[MeterRingLoadValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((12+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32)*#Scale#)
Text=[&MeasureGpu:Get('load')]%
FontSize=(11*#Scale#)
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((12+32)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))

[MeterRingLoadLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingLabel
X=((12+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)
Text=LOAD
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((12+32)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]

[MeterRingVram]
Meter=Shape
Container=MeterFrame
X=((98)*#Scale#)
Y=((14+26*#ShowTitle#)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((32)*#Scale#),((32)*#Scale#),(((32)*#Scale#)-(7+2*#H2#)*#Scale#) | Fill Color #AccentGpu#,(28*#H2#) | StrokeWidth 0
Shape=[&MeasureRing:Rest(([&MeasureGpu:VramPct()]), #Scale#, 64, 7+2*#H2#)] | StrokeWidth ((7+2*#H2#)*#Scale#) | Stroke Color #Grid#,(22+28*#H2#)
Shape2=[&MeasureRing:Arc(([&MeasureGpu:VramPct()]), #Scale#, 64, 7+2*#H2#)] | StrokeWidth ((7+2*#H2#)*#Scale#) | Stroke Color #AccentGpu#,(170+85*#H2#) | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H2#);0;0;(1+0.1*#H2#);(((((98)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H2#)))+[MeasureFrameX]*(1-(1+0.1*#H2#)));(((((14+26*#ShowTitle#)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H2#)))+#Margin#*(1-(1+0.1*#H2#)))

[MeterRingVramValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((98+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32)*#Scale#)
Text=[&MeasureGpu:Get('vramUsed', 1, 1024)]
FontSize=(11*#Scale#)
TransformationMatrix=(1+0.2*#H2#);0;0;(1+0.2*#H2#);((((98+32)*#Scale#)*(1-(1+0.2*#H2#)))+[MeasureFrameX]*(1-(1+0.2*#H2#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H2#)))+#Margin#*(1-(1+0.2*#H2#)))

[MeterRingVramLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingLabel
X=((98+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+64+6+3*#H2#)*#Scale#)
Text=VRAM GB
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H2#);0;0;(1+0.2*#H2#);((((98+32)*#Scale#)*(1-(1+0.2*#H2#)))+[MeasureFrameX]*(1-(1+0.2*#H2#)));(((((14+26*#ShowTitle#)+64+6+3*#H2#)*#Scale#)*(1-(1+0.2*#H2#)))+#Margin#*(1-(1+0.2*#H2#)))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]

[MeterRingTemp]
Meter=Shape
Container=MeterFrame
X=((184)*#Scale#)
Y=((14+26*#ShowTitle#)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((32)*#Scale#),((32)*#Scale#),(((32)*#Scale#)-(7+2*#H3#)*#Scale#) | Fill Color #AccentGpu#,(28*#H3#) | StrokeWidth 0
Shape=[&MeasureRing:Rest(([&MeasureGpu:GetNum('temp')]/100), #Scale#, 64, 7+2*#H3#)] | StrokeWidth ((7+2*#H3#)*#Scale#) | Stroke Color #Grid#,(22+28*#H3#)
Shape2=[&MeasureRing:Arc(([&MeasureGpu:GetNum('temp')]/100), #Scale#, 64, 7+2*#H3#)] | StrokeWidth ((7+2*#H3#)*#Scale#) | Stroke Color #AccentGpu#,255 | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H3#);0;0;(1+0.1*#H3#);(((((184)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H3#)))+[MeasureFrameX]*(1-(1+0.1*#H3#)));(((((14+26*#ShowTitle#)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H3#)))+#Margin#*(1-(1+0.1*#H3#)))

[MeterRingTempValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((184+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32)*#Scale#)
Text=[&MeasureGpu:Get('temp')][\x00B0]
FontSize=(11*#Scale#)
TransformationMatrix=(1+0.2*#H3#);0;0;(1+0.2*#H3#);((((184+32)*#Scale#)*(1-(1+0.2*#H3#)))+[MeasureFrameX]*(1-(1+0.2*#H3#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H3#)))+#Margin#*(1-(1+0.2*#H3#)))

[MeterRingTempLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingLabel
X=((184+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+64+6+3*#H3#)*#Scale#)
Text=TEMP
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H3#);0;0;(1+0.2*#H3#);((((184+32)*#Scale#)*(1-(1+0.2*#H3#)))+[MeasureFrameX]*(1-(1+0.2*#H3#)));(((((14+26*#ShowTitle#)+64+6+3*#H3#)*#Scale#)*(1-(1+0.2*#H3#)))+#Margin#*(1-(1+0.2*#H3#)))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H3#)]

; Hit areas: ring + caption.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=((12-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=(72*#Scale#)
H=(92*#Scale#)

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=((98-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=(72*#Scale#)
H=(92*#Scale#)

[H3]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=((184-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=(72*#Scale#)
H=(92*#Scale#)

