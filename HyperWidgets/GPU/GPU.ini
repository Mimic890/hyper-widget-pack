[Metadata]
Name=HyperWidgets GPU
Information=GPU load, VRAM, temperature from nvidia-smi (NVIDIA driver).

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
; File of the list view (right-click > View).
ListFile=GPU.ini
Accent=#AccentGpu#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale). Raise if text is cut off.
WidgetH=96

; ---------- Meters ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=GPU

; Hover (H1..H3, see Hover.inc): label and value grow, label Dim -> Text, bar gets thicker
; around its middle and its track lighter. H2 / H3 sit in the row chain right before the label;
; H1 (load: title-row value + bar) is the last meter, placed absolutely.

; Load percent on the title row, right side.
[MeterLoadValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
Text=[&MeasureGpu:Get('load')] %
FontColor=#AccentGpu#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterLoadValue:Y]+[MeterLoadValue:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[MeterLoadBar]
Meter=Bar
Container=MeterFrame
MeasureName=MeasureGpuLoad
X=(#Pad#*#Scale#)
Y=((8-1.5*#H1#)*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=((4+3*#H1#)*#Scale#)
BarOrientation=Horizontal
BarColor=#AccentGpu#,255
SolidColor=[&MeasureHover:Color('Grid', 25, #H1#, 55)]
DynamicVariables=1

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((2-1.5*#H1#)*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+6)*#Scale#)

[MeterVramLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=VRAM
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);(((#Pad#*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterVramLabel:Y]+[MeterVramLabel:H]/2)*(1-(1+0.15*#H2#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]
DynamicVariables=1

; nvidia-smi gives MB; /1024 -> GB
[MeterVramValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
Text=[&MeasureGpu:Get('vramUsed', 1, 1024)] / [&MeasureGpu:Get('vramTotal', 1, 1024)] GB
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterVramValue:Y]+[MeterVramValue:H]/2)*(1-(1+0.15*#H2#))))
DynamicVariables=1

[H3]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(2*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+6)*#Scale#)

[MeterTempLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(2*#Scale#)r
Text=TEMP
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H3#);0;0;(1+0.15*#H3#);(((#Pad#*#Scale#)*(1-(1+0.15*#H3#)))+[MeasureFrameX]*(1-(1+0.15*#H3#)));((([MeterTempLabel:Y]+[MeterTempLabel:H]/2)*(1-(1+0.15*#H3#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H3#)]
DynamicVariables=1

[MeterTempValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
Text=[&MeasureGpu:Get('temp')][\x00B0]C
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H3#);0;0;(1+0.15*#H3#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H3#)))+[MeasureFrameX]*(1-(1+0.15*#H3#)));((([MeterTempValue:Y]+[MeterTempValue:H]/2)*(1-(1+0.15*#H3#))))
DynamicVariables=1

[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((#Pad#-4)*#Scale#)
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+20)*#Scale#)
