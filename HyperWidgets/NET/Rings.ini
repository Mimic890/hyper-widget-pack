[Metadata]
Name=HyperWidgets NET (rings)
Information=Download / upload speed as rings (full ring = NetMaxDown / NetMaxUp Mbit/s).

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
@IncludeRings=#@#Rings.inc
; File of the list view (right-click > View).
ListFile=NET.ini
Accent=#AccentNet#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale); TitleCut = how much shorter without the title.
TitleCut=26
WidgetH=136

; ---------- Meters (layout in base px, all * Scale) ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=NET

; Hover (H1 / H2, see Hover.inc): ring grows 64 -> 70 px around its center, stroke 7 -> 10,
; track and fill light up, value and caption grow, caption Dim -> Text.
[MeterRingDown]
Meter=Shape
Container=MeterFrame
X=((39)*#Scale#)
Y=((14+26*#ShowTitle#)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((32)*#Scale#),((32)*#Scale#),(((32)*#Scale#)-(7+2*#H1#)*#Scale#) | Fill Color #AccentNet#,(28*#H1#) | StrokeWidth 0
Shape=[&MeasureRing:RestOf('MeasureIn', #Scale#, 64, 7+2*#H1#, (#NetMaxDown#*125000))] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #Grid#,(22+28*#H1#)
Shape2=[&MeasureRing:ArcOf('MeasureIn', #Scale#, 64, 7+2*#H1#, (#NetMaxDown#*125000))] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #AccentNet#,255 | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H1#);0;0;(1+0.1*#H1#);(((((39)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H1#)))+[MeasureFrameX]*(1-(1+0.1*#H1#)));(((((14+26*#ShowTitle#)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H1#)))+#Margin#*(1-(1+0.1*#H1#)))

[MeterRingDownValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((39+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32-3)*#Scale#)
; number and unit on two lines, so even 290.7 kB fits inside the ring (Ring.lua Num / Unit)
Text=[&MeasureRing:Num('MeasureIn')]
FontSize=(11*#Scale#)
; grows with the unit around the ring center
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((39+32)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))

[MeterRingDownUnit]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((39+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32+10)*#Scale#)
Text=[&MeasureRing:Unit('MeasureIn')]
FontSize=(7*#Scale#)
FontWeight=400
FontColor=#Dim#,255
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((39+32)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))

[MeterRingDownLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingLabel
X=((39+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)
Text=DOWN
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((39+32)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]

[MeterRingUp]
Meter=Shape
Container=MeterFrame
X=((157)*#Scale#)
Y=((14+26*#ShowTitle#)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((32)*#Scale#),((32)*#Scale#),(((32)*#Scale#)-(7+2*#H2#)*#Scale#) | Fill Color #AccentNetAlt#,(28*#H2#) | StrokeWidth 0
Shape=[&MeasureRing:RestOf('MeasureOut', #Scale#, 64, 7+2*#H2#, (#NetMaxUp#*125000))] | StrokeWidth ((7+2*#H2#)*#Scale#) | Stroke Color #Grid#,(22+28*#H2#)
Shape2=[&MeasureRing:ArcOf('MeasureOut', #Scale#, 64, 7+2*#H2#, (#NetMaxUp#*125000))] | StrokeWidth ((7+2*#H2#)*#Scale#) | Stroke Color #AccentNetAlt#,255 | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H2#);0;0;(1+0.1*#H2#);(((((157)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H2#)))+[MeasureFrameX]*(1-(1+0.1*#H2#)));(((((14+26*#ShowTitle#)*#Scale#)+64/2*#Scale#)*(1-(1+0.1*#H2#)))+#Margin#*(1-(1+0.1*#H2#)))

[MeterRingUpValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((157+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32-3)*#Scale#)
; number and unit on two lines, so even 290.7 kB fits inside the ring (Ring.lua Num / Unit)
Text=[&MeasureRing:Num('MeasureOut')]
FontSize=(11*#Scale#)
; grows with the unit around the ring center
TransformationMatrix=(1+0.2*#H2#);0;0;(1+0.2*#H2#);((((157+32)*#Scale#)*(1-(1+0.2*#H2#)))+[MeasureFrameX]*(1-(1+0.2*#H2#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H2#)))+#Margin#*(1-(1+0.2*#H2#)))

[MeterRingUpUnit]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((157+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+32+10)*#Scale#)
Text=[&MeasureRing:Unit('MeasureOut')]
FontSize=(7*#Scale#)
FontWeight=400
FontColor=#Dim#,255
TransformationMatrix=(1+0.2*#H2#);0;0;(1+0.2*#H2#);((((157+32)*#Scale#)*(1-(1+0.2*#H2#)))+[MeasureFrameX]*(1-(1+0.2*#H2#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H2#)))+#Margin#*(1-(1+0.2*#H2#)))

[MeterRingUpLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingLabel
X=((157+32)*#Scale#)
Y=(((14+26*#ShowTitle#)+64+6+3*#H2#)*#Scale#)
Text=UP
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H2#);0;0;(1+0.2*#H2#);((((157+32)*#Scale#)*(1-(1+0.2*#H2#)))+[MeasureFrameX]*(1-(1+0.2*#H2#)));(((((14+26*#ShowTitle#)+64+6+3*#H2#)*#Scale#)*(1-(1+0.2*#H2#)))+#Margin#*(1-(1+0.2*#H2#)))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]

; Hit areas: ring + caption.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=((39-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=(72*#Scale#)
H=(92*#Scale#)

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=((157-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=(72*#Scale#)
H=(92*#Scale#)
