[Metadata]
Name=HyperWidgets NET
Information=Download / upload speed with a small graph.

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
; File of the list view (right-click > View).
ListFile=NET.ini
Accent=#AccentNet#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale). Raise if text is cut off.
; TitleCut = how much shorter without the title (right-click > Title).
TitleCut=14
WidgetH=146
GraphH=50

; ---------- Meters ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=NET

; Hover (H1 / H2, see Hover.inc): label and value grow, label Dim -> Text, the other line
; of the graph fades. Hit meters sit in the row chain right before the label.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(4*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+6)*#Scale#)

[MeterDownLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=DOWN
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);(((#Pad#*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterDownLabel:Y]+[MeterDownLabel:H]/2)*(1-(1+0.15*#H1#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]
DynamicVariables=1

[MeterDownValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureIn
AutoScale=1k
NumOfDecimals=1
Text=%1B/s
FontColor=#AccentNet#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterDownValue:Y]+[MeterDownValue:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(2*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+6)*#Scale#)

[MeterUpLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(2*#Scale#)r
Text=UP
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);(((#Pad#*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterUpLabel:Y]+[MeterUpLabel:H]/2)*(1-(1+0.15*#H2#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]
DynamicVariables=1

[MeterUpValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureOut
AutoScale=1k
NumOfDecimals=1
Text=%1B/s
FontColor=#AccentNetAlt#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterUpValue:Y]+[MeterUpValue:H]/2)*(1-(1+0.15*#H2#))))
DynamicVariables=1

[MeterGraph]
Meter=Line
Container=MeterFrame
X=(#Pad#*#Scale#)
Y=(8*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=(#GraphH#*#Scale#)
LineCount=2
MeasureName=MeasureIn
MeasureName2=MeasureOut
LineColor=[&MeasureHover:Color('AccentNet', 255, #H2#, 70)]
LineColor2=[&MeasureHover:Color('AccentNetAlt', 255, #H1#, 70)]
; graph rescales so the biggest visible value fits
AutoScale=1
HorizontalLines=1
HorizontalLineColor=#Grid#,25
AntiAlias=1
DynamicVariables=1
