[Metadata]
Name=HyperWidgets RECYCLE
Information=Recycle bin size and item count. Left click: open the bin. Middle click: empty it (Windows asks first).

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeHover=#@#Hover.inc
Accent=#Text#
; Size of this widget only (right-click > Size).
Scale=1.0
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Where the size goes next to the bin (right-click > Size text): 0 left, 1 bottom, 2 right, 3 top.
NumPos=2
; No title on this widget.
ShowTitle=0
; Layout in base px (all * Scale), picked by NumPos: wide for left/right, tall for top/bottom.
WidgetW=(#NumPos# % 2 = 0 ? 148 : 96)
WidgetH=(#NumPos# % 2 = 0 ? 64 : 102)
IconX=(#NumPos# = 0 ? 96 : (#NumPos# = 2 ? 12 : 28))
IconY=(#NumPos# = 3 ? 50 : 12)
TextX=(#NumPos# = 0 ? 49 : (#NumPos# = 2 ? 99 : 48))
TextY=(#NumPos# = 3 ? 12 : (#NumPos# = 1 ? 60 : 17))

[Rainmeter]
ContextTitle15=---
ContextTitle16=Open Recycle Bin
ContextAction16=[!CommandMeasure MeasureBinSize "OpenBin"]
ContextTitle17=Empty Recycle Bin...
ContextAction17=[!CommandMeasure MeasureBinSize "EmptyBin"]
ContextTitle18=---
ContextTitle19=Size text: left
ContextAction19=[!WriteKeyValue Variables NumPos 0][!Refresh]
ContextTitle20=Size text: bottom
ContextAction20=[!WriteKeyValue Variables NumPos 1][!Refresh]
ContextTitle21=Size text: right
ContextAction21=[!WriteKeyValue Variables NumPos 2][!Refresh]
ContextTitle22=Size text: top
ContextAction22=[!WriteKeyValue Variables NumPos 3][!Refresh]

; ---------- Measures ----------
[MeasureBinSize]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Size
UpdateDivider=1

[MeasureBinCount]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Count
UpdateDivider=1

[MeasureCountText]
Measure=String
String=[MeasureBinCount] items
DynamicVariables=1
RegExpSubstitute=1
Substitute="^0 items$":"empty","^1 items$":"1 item"

; ---------- Meters ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

; Whole widget is one hit area: hover lifts the lid, clicks open / empty the bin.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
W=(#WidgetW#*#Scale#)
H=(#WidgetH#*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureBinSize "OpenBin"]
MiddleMouseUpAction=[!CommandMeasure MeasureBinSize "EmptyBin"]
ToolTipText=Click: open  |  Middle click: empty

; Bin drawn on a 40x40 grid, scaled by the matrix (Scale, plus 6% on hover) around its center.
[MeterBin]
Meter=Shape
Container=MeterFrame
X=(#IconX#*#Scale#)
Y=(#IconY#*#Scale#)
Body=11,14 | LineTo 12.8,31 | LineTo 14.5,33 | LineTo 25.5,33 | LineTo 27.2,31 | LineTo 29,14
Lid=7.5,11 | LineTo 32.5,11
Handle=16,11 | LineTo 16,7.5 | LineTo 24,7.5 | LineTo 24,11
Ribs=17,17 | LineTo 17,28.5 | ClosePath 0
Ribs2=23,17 | LineTo 23,28.5 | ClosePath 0
Shape=Path Body | StrokeWidth 2.2 | Stroke Color [&MeasureHover:Mix('Dim', 'Text', #H1#)] | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round
Shape2=Path Lid | StrokeWidth 2.2 | Stroke Color [&MeasureHover:Mix('Dim', 'Text', #H1#)] | StrokeStartCap Round | StrokeEndCap Round | Offset 0,(-2.5*#H1#)
Shape3=Path Handle | StrokeWidth 2.2 | Stroke Color [&MeasureHover:Mix('Dim', 'Text', #H1#)] | Fill Color 0,0,0,0 | StrokeLineJoin Round | StrokeStartCap Round | StrokeEndCap Round | Offset 0,(-2.5*#H1#)
Shape4=Path Ribs | StrokeWidth 1.8 | Stroke Color [&MeasureHover:Mix('Dim', 'Text', #H1#)] | StrokeStartCap Round | StrokeEndCap Round
Shape5=Path Ribs2 | StrokeWidth 1.8 | Stroke Color [&MeasureHover:Mix('Dim', 'Text', #H1#)] | StrokeStartCap Round | StrokeEndCap Round
; window point d -> k*d + t; t keeps the grid's (20,20) on the icon center (pivots add the frame offset, see Hover.inc)
TransformationMatrix=(#Scale#*(1+0.06*#H1#));0;0;(#Scale#*(1+0.06*#H1#));(([MeasureFrameX]+(#IconX#+20)*#Scale#)-(#Scale#*(1+0.06*#H1#))*([MeasureFrameX]+#IconX#*#Scale#+20));((#Margin#+(#IconY#+20)*#Scale#)-(#Scale#*(1+0.06*#H1#))*(#Margin#+#IconY#*#Scale#+20))
DynamicVariables=1

[MeterSize]
Meter=String
Container=MeterFrame
MeasureName=MeasureBinSize
X=(#TextX#*#Scale#)
Y=(#TextY#*#Scale#)
StringAlign=Center
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=700
FontColor=#Text#,255
AntiAlias=1
AutoScale=1
NumOfDecimals=1
Text=%1B
DynamicVariables=1

[MeterCount]
Meter=String
Container=MeterFrame
MeasureName=MeasureCountText
X=(#TextX#*#Scale#)
Y=((#TextY#+17)*#Scale#)
StringAlign=Center
FontFace=#FontFace#
FontSize=(8*#Scale#)
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]
AntiAlias=1
DynamicVariables=1
