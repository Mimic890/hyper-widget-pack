[Metadata]
Name=HyperWidgets DISK
Information=Used / total space: main disk big, up to 3 extra disks below.

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
; File of the list view (right-click > View).
ListFile=DISK.ini
Accent=#AccentDisk#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Height with only the main disk, and per extra disk row (base pixels, grow with Scale).
WidgetH=78
RowH=30
; Background grows with the extra disk rows.
ExtraH=(#RowH#*[MeasureExtraDisks:])

; ---------- Styles for extra disk rows ----------
; Fixed H = the text's natural height, so text growing on hover doesn't push rows below.
[StyleDiskLabel]
X=(#Pad#*#Scale#)
Y=(4*#Scale#)r
H=(#FontSize#*1.8*#Scale#)
FontFace=#FontFace#
FontColor=#Dim#,255
AntiAlias=1
DynamicVariables=1

[StyleDiskValue]
X=((#WidgetW#-#Pad#)*#Scale#)
Y=0r
H=(#FontSize#*1.8*#Scale#)
StringAlign=Right
FontFace=#FontFace#
FontColor=#Text#,255
AntiAlias=1
AutoScale=1
NumOfDecimals=0
Text=%1B / %2B
DynamicVariables=1

[StyleDiskBar]
X=(#Pad#*#Scale#)
W=((#WidgetW#-2*#Pad#)*#Scale#)
BarOrientation=Horizontal
DynamicVariables=1

; ---------- Meters ----------
; Same as StyleBg, but height grows with the number of extra disks.
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=DISK
; Click to choose disks.
SolidColor=0,0,0,1
ToolTipText=Click to choose disks
LeftMouseUpAction=[!CommandMeasure MeasureDiskInput "ExecuteBatch 1"]

; Main disk percent on the title row, right side.
[MeterDisk1Percent]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureDisk1Used
Percentual=1
Text=%1 %
FontColor=#AccentDisk#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterDisk1Percent:Y]+[MeterDisk1Percent:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

; Hover (H1..H4, see Hover.inc): label and value grow, extra-disk labels Dim -> Text, bar gets
; thicker around its middle and brighter. Hit meters sit in the row chain right before the label
; (below the title, so the title click still works).
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(4*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+20)*#Scale#)

; Main disk: accent bold label, thick bar.
[MeterDisk1Label]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=#DiskMain#
FontColor=#AccentDisk#,255
FontWeight=700
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);(((#Pad#*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterDisk1Label:Y]+[MeterDisk1Label:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[MeterDisk1Value]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureDisk1Used
MeasureName2=MeasureDisk1Total
AutoScale=1
NumOfDecimals=0
Text=%1B / %2B
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterDisk1Value:Y]+[MeterDisk1Value:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[MeterDisk1Bar]
Meter=Bar
Container=MeterFrame
MeasureName=MeasureDisk1Used
X=(#Pad#*#Scale#)
Y=((6-1.5*#H1#)*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=((6+3*#H1#)*#Scale#)
BarOrientation=Horizontal
BarColor=#AccentDisk#,255
SolidColor=[&MeasureHover:Color('Grid', 25, #H1#, 55)]
DynamicVariables=1

; Extra disks: hidden when the slot is "-" or the drive is missing.
[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((2-1.5*#H1#)*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+14)*#Scale#)
Hidden=([MeasureDisk2Total:] = 0)

[MeterDisk2Label]
Meter=String
Container=MeterFrame
MeterStyle=StyleDiskLabel
Text=#Disk2#
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);(((#Pad#*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterDisk2Label:Y]+[MeterDisk2Label:H]/2)*(1-(1+0.15*#H2#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]
Hidden=([MeasureDisk2Total:] = 0)

[MeterDisk2Value]
Meter=String
Container=MeterFrame
MeterStyle=StyleDiskValue
MeasureName=MeasureDisk2Used
MeasureName2=MeasureDisk2Total
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterDisk2Value:Y]+[MeterDisk2Value:H]/2)*(1-(1+0.15*#H2#))))
Hidden=([MeasureDisk2Total:] = 0)

[MeterDisk2Bar]
Meter=Bar
Container=MeterFrame
MeterStyle=StyleDiskBar
MeasureName=MeasureDisk2Used
Y=((4-1.5*#H2#)*#Scale#)R
H=((3+3*#H2#)*#Scale#)
BarColor=[&MeasureHover:Color('AccentDisk', 140, #H2#)]
SolidColor=[&MeasureHover:Color('Grid', 25, #H2#, 55)]
Hidden=([MeasureDisk2Total:] = 0)

[H3]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((2-1.5*#H2#)*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+14)*#Scale#)
Hidden=([MeasureDisk3Total:] = 0)

[MeterDisk3Label]
Meter=String
Container=MeterFrame
MeterStyle=StyleDiskLabel
Text=#Disk3#
FontSize=(#FontSize#*#Scale#)
