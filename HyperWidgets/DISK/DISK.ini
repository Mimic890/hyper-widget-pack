FontColor=[&MeasureHover:Mix('Dim', 'Text', #H3#)]
Hidden=([MeasureDisk3Total:] = 0)

[MeterDisk3Value]
Meter=String
Container=MeterFrame
MeterStyle=StyleDiskValue
MeasureName=MeasureDisk3Used
MeasureName2=MeasureDisk3Total
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H3#);0;0;(1+0.15*#H3#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H3#)))+[MeasureFrameX]*(1-(1+0.15*#H3#)));((([MeterDisk3Value:Y]+[MeterDisk3Value:H]/2)*(1-(1+0.15*#H3#))))
Hidden=([MeasureDisk3Total:] = 0)

[MeterDisk3Bar]
Meter=Bar
Container=MeterFrame
MeterStyle=StyleDiskBar
MeasureName=MeasureDisk3Used
Y=((4-1.5*#H3#)*#Scale#)R
H=((3+3*#H3#)*#Scale#)
