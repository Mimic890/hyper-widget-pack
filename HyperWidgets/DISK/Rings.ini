Y=(((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)
Text=#DiskMain#
FontSize=(8*#Scale#)
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+64+6+3*#H1#)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))
