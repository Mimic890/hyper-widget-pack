[Metadata]
Name=HyperWidgets DISK (rings)
Information=Disk usage as rings: main disk first, up to 3 extra disks.

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
@IncludeRings=#@#Rings.inc
; File of the list view (right-click > View).
ListFile=DISK.ini
Accent=#AccentDisk#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale); TitleCut = how much shorter without the title.
; Same as RAM / NET rings.
TitleCut=26
WidgetH=136
; Ring diameter and center-to-center step, set by [MeasureRingLayout] from the disk count.
RingD=64
RingStep=118

; 1-2 disks: same 64 px rings and spots as RAM / NET; 3: closer; 4: a bit smaller so they fit.
[MeasureRingLayout]
Measure=Calc
Formula=MeasureExtraDisks
IfCondition=MeasureRingLayout <= 1
IfTrueAction=[!SetVariable RingD 64][!SetVariable RingStep 118]
IfCondition2=MeasureRingLayout = 2
IfTrueAction2=[!SetVariable RingD 64][!SetVariable RingStep 78]
IfCondition3=MeasureRingLayout >= 3
IfTrueAction3=[!SetVariable RingD 56][!SetVariable RingStep 59]

; ---------- Meters (layout in base px, all * Scale) ----------
; Ring i (0..3) center X = 130 + (i - ExtraDisks/2) * RingStep, so the rings stay centered.
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=DISK
; Click the title to choose disks.
SolidColor=0,0,0,1
ToolTipText=Click to choose disks
LeftMouseUpAction=[!CommandMeasure MeasureDiskInput "ExecuteBatch 1"]

; Hover (H1..H4, see Hover.inc): ring grows by 6 px around its center, stroke 7 -> 10,
; track and fill light up, value and caption grow, caption Dim -> Text.
[MeterRingDisk1]
Meter=Shape
Container=MeterFrame
X=(((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)-#RingD#/2)*#Scale#)
Y=((14+26*#ShowTitle#+(64-#RingD#)/2)*#Scale#)
; hover fill only inside the stroke (overlapping it would make the track two-tone)
Shape3=Ellipse ((#RingD#/2)*#Scale#),((#RingD#/2)*#Scale#),(((#RingD#/2)*#Scale#)-(7+2*#H1#)*#Scale#) | Fill Color #AccentDisk#,(28*#H1#) | StrokeWidth 0
Shape=[&MeasureRing:RestOf('MeasureDisk1Used', #Scale#, #RingD#, 7+2*#H1#)] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #Grid#,(22+28*#H1#)
Shape2=[&MeasureRing:ArcOf('MeasureDisk1Used', #Scale#, #RingD#, 7+2*#H1#)] | StrokeWidth ((7+2*#H1#)*#Scale#) | Stroke Color #AccentDisk#,255 | StrokeStartCap Round | StrokeEndCap Round
DynamicVariables=1
; hover: grow around the ring's center (geometry stays put, so the ring can't drift)
TransformationMatrix=(1+0.1*#H1#);0;0;(1+0.1*#H1#);((((((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)-#RingD#/2)*#Scale#)+#RingD#/2*#Scale#)*(1-(1+0.1*#H1#)))+[MeasureFrameX]*(1-(1+0.1*#H1#)));(((((14+26*#ShowTitle#+(64-#RingD#)/2)*#Scale#)+#RingD#/2*#Scale#)*(1-(1+0.1*#H1#)))+#Margin#*(1-(1+0.1*#H1#)))

[MeterRingDisk1Value]
Meter=String
Container=MeterFrame
MeterStyle=StyleRingValue
X=((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)*#Scale#)
Y=(((14+26*#ShowTitle#)+32)*#Scale#)

MeasureName=MeasureDisk1Used
Percentual=1
Text=%1%
FontSize=(11*#Scale#)
TransformationMatrix=(1+0.2*#H1#);0;0;(1+0.2*#H1#);((((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)*#Scale#)*(1-(1+0.2*#H1#)))+[MeasureFrameX]*(1-(1+0.2*#H1#)));(((((14+26*#ShowTitle#)+32)*#Scale#)*(1-(1+0.2*#H1#)))+#Margin#*(1-(1+0.2*#H1#)))

