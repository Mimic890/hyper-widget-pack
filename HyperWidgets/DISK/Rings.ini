; Hit areas: ring + caption.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
X=(((130+(0-[MeasureExtraDisks:]/2)*#RingStep#)-#RingD#/2-4)*#Scale#)
Y=((14+26*#ShowTitle#-4)*#Scale#)
W=((#RingD#+8)*#Scale#)
H=(92*#Scale#)

