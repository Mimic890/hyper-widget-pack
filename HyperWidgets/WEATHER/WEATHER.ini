MouseOverAction=[!CommandMeasure MeasureWeather "Hover(11)"]

[MeterHit12]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(230*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(12)"]

[MeterSummary]
Meter=String
Container=MeterFrame
X=(130*#Scale#)
Y=(164*#Scale#)
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=(9*#Scale#)
FontColor=#Text#,200
AntiAlias=1
Text=[&MeasureWeather:Summary()]
DynamicVariables=1

; Click to change the city.
[MeterCity]
Meter=String
Container=MeterFrame
X=(130*#Scale#)
Y=(186*#Scale#)
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=(9*#Scale#)
FontColor=#Dim#,255
AntiAlias=1
SolidColor=0,0,0,1
Text=[\x25CF] [&MeasureWeather:City('#WeatherCity#', '#WeatherCountry#')]
ToolTipText=Click to change city
LeftMouseUpAction=[!CommandMeasure MeasureCityInput "ExecuteBatch 1"]
DynamicVariables=1
