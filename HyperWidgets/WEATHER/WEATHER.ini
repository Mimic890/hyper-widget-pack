[Metadata]
Name=HyperWidgets WEATHER
Information=Weather from Open-Meteo: now + 24 h chart with rain/snow. Click the city name to change it.

[Rainmeter]
; Mouse left the widget: chart goes back to the current hour.
MouseLeaveAction=[!CommandMeasure MeasureWeather "Hover(nil)"]

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
Accent=#AccentWeather#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale). Raise if text is cut off.
WidgetH=214
OpenMeteo=https://api.open-meteo.com/v1/forecast?latitude=#WeatherLat#&longitude=#WeatherLon#&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m,weather_code&past_hours=4&forecast_hours=20&daily=sunrise,sunset&forecast_days=2&timezone=auto
Geocoding=https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=

; ---------- Measures ----------
[MeasureWeatherRaw]
Measure=WebParser
URL=#OpenMeteo#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=#WeatherRate#
FinishAction=[!UpdateMeasure MeasureWeather]
OnConnectErrorAction=[!CommandMeasure MeasureWeather "Clear()"]

; City search. Real URL is set by the input box; this one only runs once on load (result ignored).
[MeasureGeoRaw]
Measure=WebParser
URL=#Geocoding##WeatherCity#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=86400
FinishAction=[!CommandMeasure MeasureWeather "ApplyGeo()"]
OnConnectErrorAction=[!CommandMeasure MeasureWeather "status = 'no connection'"]

; Parses only when a download finishes (FinishAction).
[MeasureWeather]
Measure=Script
ScriptFile=#@#Scripts\Weather.lua
Source=MeasureWeatherRaw
GeoSource=MeasureGeoRaw
VarsFile=#@#Variables.inc
UpdateDivider=-1

; Text box over the city row (bottom). Plugin X/Y count from the skin, so + the frame offset. Enter = search and save, Esc / click away = cancel.
[MeasureCityInput]
Measure=Plugin
Plugin=InputText
X=(#Pad#*#Scale#+[MeasureFrameX])
Y=(182*#Scale#+#Margin#)
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=(20*#Scale#)
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#Text#
SolidColor=#Bg#,255
DefaultValue=#WeatherCity#
; X follows the frame (it moves left at the right screen edge)
DynamicVariables=1
Command1=[!CommandMeasure MeasureWeather "StartGeo()"][!UpdateMeter MeterCity][!Redraw][!SetOption MeasureGeoRaw URL "#Geocoding#$UserInput$"][!CommandMeasure MeasureGeoRaw Update]

; ---------- Meters (layout in base px, all * Scale; center line x=130; no title) ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterDesc]
Meter=String
Container=MeterFrame
X=(130*#Scale#)
Y=(12*#Scale#)
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=(13*#Scale#)
FontColor=#Text#,255
AntiAlias=1
Text=[&MeasureWeather:Desc()]
DynamicVariables=1

[MeterFeels]
Meter=String
Container=MeterFrame
X=(130*#Scale#)
Y=(36*#Scale#)
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=(10*#Scale#)
FontColor=#Dim#,255
AntiAlias=1
Text=Feels like [&MeasureWeather:Get('apparent_temperature')][\x00B0]C
DynamicVariables=1

; 24 h chart: 12 bars, one per 2 hours, bar 3 = now. Box 236 x 72 at (12, 64).
; Yellow blocks = daylight (sunrise..sunset). Blue bars = rain, white-blue = snow.
; Hover a bar: it lights up and smoothly grows (MeasureAnim), its temperature shows above and its hour below.
[MeterChart]
Meter=Shape
Container=MeterFrame
X=(#Pad#*#Scale#)
Y=(64*#Scale#)
Group=Chart
Day=270 | 250,204,21,30 ; 0.0 | 250,204,21,0 ; 1.0
Shape=Rectangle [&MeasureWeather:DayRect(1, #Scale#)],(10*#Scale#) | Fill LinearGradient Day | StrokeWidth 0
Shape2=Rectangle [&MeasureWeather:DayRect(2, #Scale#)],(10*#Scale#) | Fill LinearGradient Day | StrokeWidth 0
G1=[&MeasureWeather:BarGradient(1)]
Shape3=Rectangle ([&MeasureWeather:DrawX(1)]*#Scale#),((72-[&MeasureWeather:DrawH(1)])*#Scale#),([&MeasureWeather:DrawW(1)]*#Scale#),([&MeasureWeather:DrawH(1)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G1 | StrokeWidth 0
G2=[&MeasureWeather:BarGradient(2)]
Shape4=Rectangle ([&MeasureWeather:DrawX(2)]*#Scale#),((72-[&MeasureWeather:DrawH(2)])*#Scale#),([&MeasureWeather:DrawW(2)]*#Scale#),([&MeasureWeather:DrawH(2)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G2 | StrokeWidth 0
G3=[&MeasureWeather:BarGradient(3)]
Shape5=Rectangle ([&MeasureWeather:DrawX(3)]*#Scale#),((72-[&MeasureWeather:DrawH(3)])*#Scale#),([&MeasureWeather:DrawW(3)]*#Scale#),([&MeasureWeather:DrawH(3)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G3 | StrokeWidth 0
G4=[&MeasureWeather:BarGradient(4)]
Shape6=Rectangle ([&MeasureWeather:DrawX(4)]*#Scale#),((72-[&MeasureWeather:DrawH(4)])*#Scale#),([&MeasureWeather:DrawW(4)]*#Scale#),([&MeasureWeather:DrawH(4)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G4 | StrokeWidth 0
G5=[&MeasureWeather:BarGradient(5)]
Shape7=Rectangle ([&MeasureWeather:DrawX(5)]*#Scale#),((72-[&MeasureWeather:DrawH(5)])*#Scale#),([&MeasureWeather:DrawW(5)]*#Scale#),([&MeasureWeather:DrawH(5)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G5 | StrokeWidth 0
G6=[&MeasureWeather:BarGradient(6)]
Shape8=Rectangle ([&MeasureWeather:DrawX(6)]*#Scale#),((72-[&MeasureWeather:DrawH(6)])*#Scale#),([&MeasureWeather:DrawW(6)]*#Scale#),([&MeasureWeather:DrawH(6)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G6 | StrokeWidth 0
G7=[&MeasureWeather:BarGradient(7)]
Shape9=Rectangle ([&MeasureWeather:DrawX(7)]*#Scale#),((72-[&MeasureWeather:DrawH(7)])*#Scale#),([&MeasureWeather:DrawW(7)]*#Scale#),([&MeasureWeather:DrawH(7)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G7 | StrokeWidth 0
G8=[&MeasureWeather:BarGradient(8)]
Shape10=Rectangle ([&MeasureWeather:DrawX(8)]*#Scale#),((72-[&MeasureWeather:DrawH(8)])*#Scale#),([&MeasureWeather:DrawW(8)]*#Scale#),([&MeasureWeather:DrawH(8)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G8 | StrokeWidth 0
G9=[&MeasureWeather:BarGradient(9)]
Shape11=Rectangle ([&MeasureWeather:DrawX(9)]*#Scale#),((72-[&MeasureWeather:DrawH(9)])*#Scale#),([&MeasureWeather:DrawW(9)]*#Scale#),([&MeasureWeather:DrawH(9)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G9 | StrokeWidth 0
G10=[&MeasureWeather:BarGradient(10)]
Shape12=Rectangle ([&MeasureWeather:DrawX(10)]*#Scale#),((72-[&MeasureWeather:DrawH(10)])*#Scale#),([&MeasureWeather:DrawW(10)]*#Scale#),([&MeasureWeather:DrawH(10)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G10 | StrokeWidth 0
G11=[&MeasureWeather:BarGradient(11)]
Shape13=Rectangle ([&MeasureWeather:DrawX(11)]*#Scale#),((72-[&MeasureWeather:DrawH(11)])*#Scale#),([&MeasureWeather:DrawW(11)]*#Scale#),([&MeasureWeather:DrawH(11)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G11 | StrokeWidth 0
G12=[&MeasureWeather:BarGradient(12)]
Shape14=Rectangle ([&MeasureWeather:DrawX(12)]*#Scale#),((72-[&MeasureWeather:DrawH(12)])*#Scale#),([&MeasureWeather:DrawW(12)]*#Scale#),([&MeasureWeather:DrawH(12)]*#Scale#),(3.5*#Scale#) | Fill LinearGradient G12 | StrokeWidth 0
DynamicVariables=1

; Temperature above the selected bar (now, or the hovered one).
[MeterSelTemp]
Meter=String
Container=MeterFrame
X=([&MeasureWeather:SelX()]*#Scale#)
Y=([&MeasureWeather:SelY()]*#Scale#)
StringAlign=CenterBottom
FontFace=#FontFace#
FontSize=(10*#Scale#)
FontWeight=700
FontColor=#Text#,255
AntiAlias=1
Text=[&MeasureWeather:SelTemp()][\x00B0]
Group=Chart
DynamicVariables=1

; Hour under the selected bar.
[MeterSelHour]
Meter=String
Container=MeterFrame
X=([&MeasureWeather:SelX()]*#Scale#)
Y=(142*#Scale#)
StringAlign=CenterTop
FontFace=#FontFace#
FontSize=(8*#Scale#)
FontColor=#Dim#,255
AntiAlias=1
Text=[&MeasureWeather:SelHour()]
Group=Chart
DynamicVariables=1

; Invisible hover areas, one 20 px column per bar (alpha 1 so the mouse sees them).
; No MouseLeave here: moving between columns would flash back to "now". Reset is on the whole skin.
; Hover animation: ~16 frames at 16 ms, each eases the bar sizes (Tick in Weather.lua) and redraws.
[MeasureAnim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame, 16, 16
Frame=[!CommandMeasure MeasureWeather "Tick()"][!UpdateMeterGroup Chart][!Redraw]
IgnoreWarnings=1

[StyleHit]
Y=(64*#Scale#)
; 72 px of bars + 24 px below (hour row), so you can hover from underneath without covering the bar.
Shape=Rectangle 0,0,(20*#Scale#),(96*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
; Keep the normal arrow cursor over the chart.
MouseActionCursor=0

[MeterHit1]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(10*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(1)"]

[MeterHit2]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(30*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(2)"]

[MeterHit3]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(50*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(3)"]

