Container=MeterFrame
MeterStyle=StyleHit
X=(70*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(4)"]

[MeterHit5]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(90*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(5)"]

[MeterHit6]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(110*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(6)"]

[MeterHit7]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleHit
X=(130*#Scale#)
MouseOverAction=[!CommandMeasure MeasureWeather "Hover(7)"]

[MeterHit8]
