; Invisible helper for Appearance=Auto: checks wallpaper brightness and switches Light/Dark.
; Loaded by Themes... > Auto, unloads itself when Light or Dark is picked.

[Rainmeter]
Update=1000
Group=HyperWidgets

[Variables]
@Include=#@#Variables.inc

; Must stay first so Apply() exists when PowerShell finishes.
[MeasureAuto]
Measure=Script
ScriptFile=#@#Scripts\AutoMode.lua
Source=MeasureWallpaper
Appearance=#Appearance#
Mode=#Mode#
VarsFile=#@#Variables.inc
UpdateDivider=-1

[MeasureWallpaper]
Measure=Plugin
Plugin=RunCommand
Program=powershell
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\WallpaperMode.ps1"
State=Hide
OutputType=ANSI
Timeout=20000
FinishAction=[!CommandMeasure MeasureAuto "Apply()"]

; Runs the check on load and then every AutoCheck seconds.
[MeasureTimer]
Measure=Calc
Formula=1
UpdateDivider=#AutoCheck#
OnUpdateAction=[!CommandMeasure MeasureWallpaper "Run"]

[MeterDummy]
Meter=String
