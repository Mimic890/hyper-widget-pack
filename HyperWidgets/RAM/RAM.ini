[Metadata]
Name=HyperWidgets RAM
Information=Used / total physical memory.

[Variables]
@Include=#@#Variables.inc
@IncludeTheme=#@#Themes\#Theme#.inc
@IncludeCommon=#@#Common.inc
@IncludeMeasures=#CURRENTPATH#Measures.inc
@IncludeViews=#@#Views.inc
@IncludeHover=#@#Hover.inc
; File of the list view (right-click > View).
ListFile=RAM.ini
Accent=#AccentRam#
; Size of this widget only (right-click > Size). 1.0 = 260 px wide.
Scale=0.75
; Background opacity of this widget only, 0..255 (right-click > Opacity).
BgAlpha=200
; Background height in base pixels (grows with Scale). Raise if text is cut off.
WidgetH=112

; ---------- Meters ----------
[MeterSpacer]
Meter=Shape
MeterStyle=StyleSpacer

[MeterFrame]
Meter=Shape
MeterStyle=StyleFrame

[MeterBg]
Meter=Shape
Container=MeterFrame
MeterStyle=StyleBg

[MeterTitle]
Meter=String
Container=MeterFrame
MeterStyle=StyleTitle
Text=RAM

; Percent on the title row, right side.
[MeterPercent]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureUsed
Percentual=1
Text=%1 %
FontColor=#AccentRam#,255
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterPercent:Y]+[MeterPercent:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

; Hover (H1 / H2, see Hover.inc): label and value grow, label Dim -> Text, bar gets thicker
; around its middle and brighter. Hit meters sit in the row chain right before the label.
[H1]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=(4*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+18)*#Scale#)

[MeterUsedLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=USED
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);(((#Pad#*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterUsedLabel:Y]+[MeterUsedLabel:H]/2)*(1-(1+0.15*#H1#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H1#)]
DynamicVariables=1

[MeterUsedValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureUsed
MeasureName2=MeasureTotal
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H1#);0;0;(1+0.15*#H1#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H1#)))+[MeasureFrameX]*(1-(1+0.15*#H1#)));((([MeterUsedValue:Y]+[MeterUsedValue:H]/2)*(1-(1+0.15*#H1#))))
DynamicVariables=1

[MeterUsedBar]
Meter=Bar
Container=MeterFrame
MeasureName=MeasureUsed
X=(#Pad#*#Scale#)
Y=((6-1.5*#H1#)*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=((4+3*#H1#)*#Scale#)
BarOrientation=Horizontal
BarColor=#AccentRam#,255
SolidColor=[&MeasureHover:Color('Grid', 25, #H1#, 55)]
DynamicVariables=1

[H2]
Meter=Image
Container=MeterFrame
MeterStyle=StyleHit
Y=((4-1.5*#H1#)*#Scale#)R
W=(#WidgetW#*#Scale#)
H=((#FontSize#*1.8+17)*#Scale#)

[MeterSwapLabel]
Meter=String
Container=MeterFrame
MeterStyle=StyleLabel
Y=(4*#Scale#)r
Text=SWAP
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);(((#Pad#*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterSwapLabel:Y]+[MeterSwapLabel:H]/2)*(1-(1+0.15*#H2#))))
FontColor=[&MeasureHover:Mix('Dim', 'Text', #H2#)]
DynamicVariables=1

[MeterSwapValue]
Meter=String
Container=MeterFrame
MeterStyle=StyleValue
MeasureName=MeasureSwapUsed
MeasureName2=MeasureSwapTotal
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B
FontSize=(#FontSize#*#Scale#)
TransformationMatrix=(1+0.15*#H2#);0;0;(1+0.15*#H2#);((((#WidgetW#-#Pad#)*#Scale#)*(1-(1+0.15*#H2#)))+[MeasureFrameX]*(1-(1+0.15*#H2#)));((([MeterSwapValue:Y]+[MeterSwapValue:H]/2)*(1-(1+0.15*#H2#))))
DynamicVariables=1

[MeterSwapBar]
Meter=Bar
Container=MeterFrame
MeasureName=MeasureSwapPercent
X=(#Pad#*#Scale#)
Y=((6-1.5*#H2#)*#Scale#)R
W=((#WidgetW#-2*#Pad#)*#Scale#)
H=((3+3*#H2#)*#Scale#)
BarOrientation=Horizontal
BarColor=[&MeasureHover:Color('AccentRam', 140, #H2#)]
SolidColor=[&MeasureHover:Color('Grid', 25, #H2#, 55)]
DynamicVariables=1
